{% extends "maestra.html" %}
{% block contenido %}
<div class="columns is-centered">
    <div class="column is-one-third">
        <h2 class="title is-3 has-text-centered">Registro de Usuario</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="notification is-warning">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="field">
                <label class="label">Usuario:</label>
                <div class="control">
                    <input class="input" type="text" name="username" placeholder="Crea un usuario" required>
                </div>
            </div>

            <div class="field">
                <label class="label">Contraseña:</label>
                <div class="control">
                    <input class="input" type="password" name="password" placeholder="Crea una contraseña" required>
                </div>
            </div>

            <div class="field mt-4">
                <button type="submit" class="button is-success is-fullwidth">Registrar</button>
            </div>
        </form>
        
        <p class="has-text-centered mt-3">
            ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
        </p>
    </div>
</div>
{% endblock %}
