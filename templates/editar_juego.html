{% extends "maestra.html" %}
{% block contenido %}
<div class="columns">
    <div class="column is-one-third">
        <h2 class="title is-2">Editar juego</h2>
        <form action="{{ url_for('actualizar_juego') }}" method="POST">
            <input type="hidden" name="id" value="{{ juego.id }}">

            <div class="field">
                <label class="label">Nombre:</label>
                <div class="control">
                    <input class="input" type="text" name="nombre" value="{{ juego.nombre }}" required>
                </div>
            </div>

            <div class="field">
                <label class="label">Descripción:</label>
                <div class="control">
                    <input class="input" type="text" name="descripcion" value="{{ juego.descripcion }}" required>
                </div>
            </div>

            <div class="field">
                <label class="label">Precio:</label>
                <div class="control">
                    <input class="input" type="number" step="0.01" name="precio" value="{{ juego.precio }}" required>
                </div>
            </div>

            <div class="field is-grouped">
                <div class="control">
                    <button type="submit" class="button is-info">Guardar</button>
                </div>
                <div class="control">
                    <a href="{{ url_for('juegos') }}" class="button is-light">Volver</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
