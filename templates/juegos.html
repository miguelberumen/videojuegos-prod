{% extends "maestra.html" %}
{% block contenido %}
<div class="columns">
    <div class="column">
        <h2 class="title is-2">Juegos</h2>
        <a href="{{ url_for('agregar_juego') }}" class="button is-success mb-4">Agregar</a>
        
        <table class="table is-fullwidth">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Editar</th>
                    <th>Eliminar</th>
                </tr>
            </thead>
            <tbody>
                {% for juego in juegos %}
                <tr>
                    <td>{{ juego.nombre }}</td>
                    <td>{{ juego.descripcion }}</td>
                    <td>{{ juego.precio }}</td>
                    <td>
                        <a href="{{ url_for('editar_juego', id=juego.id) }}" class="button is-info">Editar</a>
                    </td>
                    <td>
                        <a href="{{ url_for('eliminar_juego', id=juego.id) }}" class="button is-danger" onclick="return confirm('¿Deseas eliminar este juego?');">Eliminar</a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="has-text-centered">No hay juegos registrados.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
