{% extends "maestra.html" %}
{% block contenido %}
<div class="columns is-centered">
    <div class="column is-one-third">
        <h2 class="title is-3 has-text-centered">Iniciar Sesión</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="notification is-danger">
              {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}
        <form action="{{ url_for('login') }}" method="POST">
            <div class="field">
                <label class="label">Usuario:</label>
                <div class="control">
                    <input class="input" type="text" name="username" placeholder="Ingresa tu usuario" required>
                </div>
            </div>

            <div class="field">
                <label class="label">Contraseña:</label>
                <div class="control">
                    <input class="input" type="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>
            </div>

            <div class="field">
                <button type="submit" class="button is-info is-fullwidth">Entrar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
